[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harmony-agcctl"
version = "0.1.0"
description = "Local CLI for Qianshou HarmonyOS AppGallery Connect publish operations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "pydantic>=2.9",
  "PyJWT>=2.9",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
agcctl = "agc_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agc_cli = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
